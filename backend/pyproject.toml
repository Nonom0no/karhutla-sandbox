[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karhutla-sandbox-backend"
version = "0.1.0"
description = "Backend API and simulation engine for Karhutla Sandbox"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.1,<3",
    "pydantic-settings>=2.1,<3",
    "uvicorn>=0.30,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["scripts/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
